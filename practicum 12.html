<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Bridge - Endpoint Data Management</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #f4f7fb;
      color: #243b53;
      font-family: Arial, sans-serif;
    }

    main { max-width: 900px; margin: auto; }
    h1, h2 { color: #102a43; }

    .notice, .record, form {
      margin: 16px 0;
      padding: 16px;
      background: white;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
    }

    label { display: block; margin: 10px 0 5px; }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #9fb3c8;
      border-radius: 4px;
      font: inherit;
    }

    button {
      margin: 8px 6px 0 0;
      padding: 9px 13px;
      border: 0;
      border-radius: 5px;
      background: #087e8b;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #066873; }
    .delete-button { background: #b42318; }
    .delete-button:hover { background: #8f1c13; }
    #status { min-height: 1.5em; font-weight: bold; }
    .record h3 { margin-top: 0; color: #102a43; }

    @media (max-width: 600px) {
      body { padding: 12px; }
    }
  </style>
</head>

<body>
  <main>
    <h1>Finance Bridge</h1>
    <h2>Financial Updates</h2>

    <p class="notice">
      This practicum uses a demo API. Enter sample information only.
      Changes are temporary and are not saved by the server.
    </p>

    <form id="recordForm">
      <h2>Add a Financial Update</h2>

      <label for="recordTitle">Title</label>
      <input id="recordTitle" required minlength="3" maxlength="80">

      <label for="recordBody">Details</label>
      <textarea id="recordBody" required minlength="5" maxlength="300"></textarea>

      <button type="submit">Add Update</button>
    </form>

    <p id="status" role="status" aria-live="polite">Loading updates...</p>
    <section id="records" aria-label="Financial updates"></section>
  </main>

  <script>
    const API_URL = "https://jsonplaceholder.typicode.com/posts";
    const recordsElement = document.getElementById("records");
    const statusElement = document.getElementById("status");
    const form = document.getElementById("recordForm");
    let records = [];

    async function apiRequest(url, options = {}) {
      const response = await fetch(url, options);

      if (!response.ok) {
        throw new Error("The server returned status " + response.status);
      }

      if (response.status === 204) return null;
      return response.json();
    }

    function renderRecords() {
      recordsElement.replaceChildren();

      records.forEach(record => {
        const article = document.createElement("article");
        article.className = "record";

        const title = document.createElement("h3");
        title.textContent = record.title;

        const details = document.createElement("p");
        details.textContent = record.body;

        const id = document.createElement("small");
        id.textContent = "Endpoint record ID: " + record.id;

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.addEventListener("click", () => editRecord(record.localKey));

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete-button";
        deleteButton.addEventListener("click", () => deleteRecord(record.localKey));

        article.append(title, details, id, document.createElement("br"), editButton, deleteButton);
        recordsElement.appendChild(article);
      });
    }

    async function loadRecords() {
      try {
        statusElement.textContent = "Retrieving updates from the endpoint...";
        const data = await apiRequest(API_URL + "?userId=1&_limit=6");

        records = data.map(record => ({
          ...record,
          localKey: String(record.id)
        }));

        renderRecords();
        statusElement.textContent = "Updates loaded successfully using GET.";
      } catch (error) {
        statusElement.textContent = "Could not load updates: " + error.message;
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!form.reportValidity()) return;

      const newRecord = {
        title: document.getElementById("recordTitle").value.trim(),
        body: document.getElementById("recordBody").value.trim(),
        userId: 1
      };

      try {
        statusElement.textContent = "Adding update...";
        const created = await apiRequest(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=UTF-8" },
          body: JSON.stringify(newRecord)
        });

        created.localKey = "new-" + Date.now();
        records.unshift(created);
        renderRecords();
        form.reset();
        statusElement.textContent = "Update added using POST (demo only).";
      } catch (error) {
        statusElement.textContent = "Could not add update: " + error.message;
      }
    });

    async function editRecord(localKey) {
      const record = records.find(item => item.localKey === localKey);
      if (!record) return;

      const updatedTitle = prompt("Edit the update title:", record.title);
      if (updatedTitle === null) return;

      const title = updatedTitle.trim();
      if (title.length < 3) {
        statusElement.textContent = "The title must contain at least 3 characters.";
        return;
      }

      try {
        statusElement.textContent = "Updating record...";
        await apiRequest(API_URL + "/" + record.id, {
          method: "PATCH",
          headers: { "Content-Type": "application/json; charset=UTF-8" },
          body: JSON.stringify({ title })
        });

        record.title = title;
        renderRecords();
        statusElement.textContent = "Record updated using PATCH (demo only).";
      } catch (error) {
        statusElement.textContent = "Could not update record: " + error.message;
      }
    }

    async function deleteRecord(localKey) {
      const record = records.find(item => item.localKey === localKey);
      if (!record || !confirm("Delete this financial update?")) return;

      try {
        statusElement.textContent = "Deleting record...";
        await apiRequest(API_URL + "/" + record.id, { method: "DELETE" });

        records = records.filter(item => item.localKey !== localKey);
        renderRecords();
        statusElement.textContent = "Record deleted using DELETE (demo only).";
      } catch (error) {
        statusElement.textContent = "Could not delete record: " + error.message;
      }
    }

    loadRecords();
  </script>
</body>
</html>
